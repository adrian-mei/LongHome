services:
  longhome:
    build: .
    restart: unless-stopped
    ports:
      - "${LONGHOME_HTTP_PORT:-3000}:3000"
    environment:
      LONGHOME_AI_API_KEY: ${LONGHOME_AI_API_KEY:-}
      LONGHOME_AI_MODEL: ${LONGHOME_AI_MODEL:-}
      LONGHOME_AI_PROVIDER: ${LONGHOME_AI_PROVIDER:-}
      LONGHOME_AI_TIMEOUT_MS: ${LONGHOME_AI_TIMEOUT_MS:-60000}
      LONGHOME_PUBLIC_URL: ${LONGHOME_PUBLIC_URL:-}
      LONGHOME_WRITE_TOKEN: ${LONGHOME_WRITE_TOKEN:-}
    volumes:
      - ./data:/app/data
